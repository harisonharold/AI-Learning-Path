# Production overlay for one VM (PLAN D-03): Caddy replaces Jaeger; no internal service publishes a port.
# docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  jaeger: !reset null
  mysql:
    ports: !reset []
  web:
    ports: !reset []
    environment:
      ATLAS_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [internal, edge]
  api-py:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  worker-py:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  worker-node:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST:?}
      SANDBOX_HOST: ${SANDBOX_HOST:?}
      APP_ORIGIN: https://${APP_HOST}
      # Host header web sees for the sandbox; must equal the host of web's SANDBOX_ORIGIN.
      SANDBOX_UPSTREAM_HOST: ${SANDBOX_HOST:?}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [edge]
    depends_on: [web]

networks:
  edge: {}

volumes:
  caddy-data: {}
