# Development stack: 7 containers (PLAN D-03). Start with: pnpm up   (generates .env on first run)
name: systems-atlas

x-hmac: &hmac
  INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY:?run infra/scripts/gen-env.sh}

networks:
  internal:
    ipam:
      config: [{ subnet: 172.28.0.0/16 }] # pinned so the SSRF blocklist can name it (PLAN D-17)

volumes:
  mysql-data: {}
  raw-data: {}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: atlas
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      MYSQL_MIGRATE_PASSWORD: ${MYSQL_MIGRATE_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/my.cnf:/etc/mysql/conf.d/atlas.cnf:ro
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    environment:
      <<: *hmac
      ATLAS_ENV: ${ATLAS_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SANDBOX_ORIGIN: ${SANDBOX_ORIGIN:-http://127.0.0.1:3000}
      DATABASE_URL: mysql://atlas_app:${MYSQL_APP_PASSWORD}@mysql:3306/atlas
      DATABASE_MIGRATE_URL: mysql://atlas_migrate:${MYSQL_MIGRATE_PASSWORD}@mysql:3306/atlas
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      ALLOWED_GITHUB_USER_ID: ${ALLOWED_GITHUB_USER_ID:?}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:?}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      API_PY_URL: http://api-py:8000
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-30}
    volumes: ["raw-data:/data/raw"]
    networks: [internal]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker-node:
    build: { context: ../.., dockerfile: apps/worker-node/Dockerfile }
    environment:
      <<: *hmac
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks: [internal]
    depends_on: { redis: { condition: service_healthy } }

  api-py:
    build: { context: ../.., dockerfile: services/Dockerfile }
    command: ["python", "-m", "api_py.app"]
    environment:
      <<: *hmac
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks: [internal]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker-py:
    build: { context: ../.., dockerfile: services/Dockerfile }
    command: ["python", "-m", "worker_py.main"]
    environment:
      <<: *hmac
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEB_INTERNAL_URL: http://web:3000
    networks: [internal]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    networks: [internal]
    ports: ["127.0.0.1:16686:16686"]
