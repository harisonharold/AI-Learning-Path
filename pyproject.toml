[project]
name = "systems-atlas-py"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/common", "services/api-py", "services/worker-py"]

[tool.uv.sources]
atlas-common = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390", "jsonschema>=4.23", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Practice tests run after the learner's code in the same namespace, so the function under test is defined at runtime.
"content/exercises/*/practice_tests.py" = ["F821"]

[tool.pyright]
include = ["services"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Untyped third-party libraries (redis, bullmq, jsonschema) make these noise; all other strict checks stay on.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
