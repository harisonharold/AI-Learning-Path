[project]
name = "worker-py"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["atlas-common", "bullmq==3.6.1", "httpx>=0.28", "redis>=5.2"]

[tool.uv.sources]
atlas-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_py"]
