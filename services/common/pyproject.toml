[project]
name = "atlas-common"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "pydantic>=2.10",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_common"]
