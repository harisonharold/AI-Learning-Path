# Temporary (P3-core): records network fixtures and live source checks on a runner with internet access.
# Runs only on pushes to p3-core that touch the recorder. Removed again before the P3-core PR is reviewed.
name: record-fixtures
on:
  push:
    branches: [p3-core]
    paths: [apps/worker-node/scripts/record-fixtures.ts, .github/workflows/record-fixtures.yml]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with: { node-version: 24, package-manager-cache: false } # v5 would otherwise try to cache pnpm, which this job does not install
      - run: node apps/worker-node/scripts/record-fixtures.ts
