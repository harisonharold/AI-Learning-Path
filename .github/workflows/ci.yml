name: ci
on:
  push:
  pull_request:
# Actions are pinned to full commit SHAs (PLAN D-38). SHAs are the ones these tags resolved to in CI run
# 43916244822 (2026-11-16, from the runner's "Download action repository" log lines). Update deliberately.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: lint · typecheck · unit · bundle scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:strings
      - name: AT-03 secret-in-bundle scan (canary values)
        run: sh infra/ci/build-and-scan.sh

  python:
    name: ruff · pyright · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0 (node24)
      - run: uv sync --frozen --all-packages --python 3.12
      # Lets atlas-lab's real Docker gate test run here instead of skipping (image pinned by digest, as in the bundle).
      - run: docker pull -q python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  integration:
    name: integration (Testcontainers MySQL 8.4 + Redis 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  e2e:
    name: compose · e2e · axe · edge
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 (node24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start stack (7 services + test-only mock GitHub)
        run: pnpm up:test
      - name: AT-01 all /healthz 200 within 120 s
        run: sh infra/scripts/compose-smoke.sh -f infra/compose/compose.test.yaml
      - run: pnpm exec playwright install --with-deps chromium
      # The P2 e2e tests drive the real atlas-lab CLI (gate tests in Docker --network none, benchmark uploads).
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0 (node24)
      - run: uv sync --frozen --all-packages --python 3.12
      - name: Playwright e2e + axe (both themes)
        run: pnpm exec playwright test --trace off
      - name: X-02 Caddy edge rules
        run: sh infra/caddy/caddy.test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose/compose.yaml -f infra/compose/compose.test.yaml logs --no-color | tail -300
